# Which backend xdg-desktop-portal uses for each portal, in WSL. WSL sets no
# XDG_CURRENT_DESKTOP, so this file is the one read. WSL only (.chezmoiignore):
# a user portals.conf outranks a native desktop's own <desktop>-portals.conf,
# which lives in a lower-precedence directory.
#   https://github.com/flatpak/xdg-desktop-portal/blob/1d20fadc304f6601452b5db65ed91197dba77041/doc/portals.conf.rst.in#L56-L78
#
# Only Settings: the light/dark preference, which xdg-desktop-portal-gtk serves
# from the gsettings wsl-color-scheme.service writes. Every other interface is
# none on purpose. With a FileChooser on offer, VS Code (Chromium) hands its
# open and save dialogs to the portal instead of drawing GTK's in its own
# process, and xdg-desktop-portal-gtk is started by systemd, without the
# toolkit scales and cursor size .chezmoitemplates/registry-user.reg gives
# apps.
#   https://github.com/chromium/chromium/blob/157ab90b596b1b38003753649a15b88ed11f7fdf/ui/shell_dialogs/select_file_dialog_linux_portal.cc#L162-L184
#   https://github.com/flatpak/xdg-desktop-portal/blob/1d20fadc304f6601452b5db65ed91197dba77041/doc/portals.conf.rst.in#L100-L110
[preferred]
default=none
org.freedesktop.impl.portal.Settings=gtk
