# WSLg's displays, for systemd --user services. WSL sets WAYLAND_DISPLAY and
# DISPLAY in the sessions it starts, not in the user manager, so its services
# had neither; environment.d is what the user manager reads. The one that needs
# them is xdg-desktop-portal-gtk, a GTK program that exits without a display,
# which the portal starts to serve the light/dark preference
# (wsl-color-scheme.service, wslg-session.target). WSL links WSLg's wayland-0
# into $XDG_RUNTIME_DIR, and WSLg's X server is :0. A daemon-reload re-reads
# this file for the services started after it, and
# .chezmoiscripts/00-linux/151-wsl-desktop-session runs one. WSL only
# (.chezmoiignore).
#   https://github.com/systemd/systemd/blob/9ca433482f2281d71718718705ca8cd3bf562ad6/man/systemd.environment-generator.xml#L54-L73
WAYLAND_DISPLAY=wayland-0
DISPLAY=:0
