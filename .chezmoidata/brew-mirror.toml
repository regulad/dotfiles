# Bottle mirror for every brew this repo runs (see docs/brew-mirror.md). A
# Sonatype Nexus docker (proxy) repository in front of ghcr.io: it caches
# every bottle a host pulls, so the old blobs the era-pinned Macs depend on
# (.chezmoidata/brew-tiers.toml) stay fetchable even if GitHub Packages ever
# retires them, and repeat installs come off the cache.
#
# Rendered into HOMEBREW_ARTIFACT_DOMAIN and, joined by ":" and base64d,
# HOMEBREW_DOCKER_REGISTRY_BASIC_AUTH_TOKEN by
# .chezmoitemplates/brew-mirror-env.sh, which posix-preamble.sh and
# dot_commonprofile.tmpl include on every host. It exports them at run time
# everywhere but on a GitHub-hosted Actions runner.
#
# The account is read-only on the proxy (pull only, nothing else on the
# server) and the only way in -- anonymous access is off -- created for
# exactly this, and deliberately committed in the clear:
# the alternative is a first apply that cannot install a single bottle until
# bitwarden is unlocked, on a machine whose bitwarden-cli comes from brew.
[brewMirror]
artifact_domain = "https://repo.regulad.xyz/repository/ghcr-io"
user = "knownguest"
password = "H5RarjaU5XbQN4zB"
