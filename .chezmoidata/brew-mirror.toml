# Bottle mirror for the era-pinned brews (see .chezmoidata/brew-tiers.toml
# and docs/homebrew-older-macos.md, "Bottle mirror"). A Sonatype Nexus
# docker (proxy) repository in front of ghcr.io: it caches every bottle an
# old Mac pulls, so the blobs stay fetchable even if GitHub Packages ever
# retires them, and repeat installs come off the LAN-side cache.
#
# Rendered into HOMEBREW_ARTIFACT_DOMAIN and, joined by ":" and base64d,
# HOMEBREW_DOCKER_REGISTRY_BASIC_AUTH_TOKEN by .chezmoitemplates/brew-mirror-env.sh,
# which posix-preamble.sh and dot_commonprofile.tmpl include on every
# era-pinned host except Mojave (its brew 3.2.17 cannot use a mirror safely).
#
# The account is read-only on the proxy (pull only, nothing else on the
# server) and the only way in -- anonymous access is off -- created for
# exactly this, and deliberately committed in the clear:
# the alternative is a first apply that cannot install a single bottle until
# bitwarden is unlocked, on a machine whose bitwarden-cli comes from brew.
[brewMirror]
artifact_domain = "https://repo.regulad.xyz/repository/ghcr-io"
user = "knownguest"
password = "H5RarjaU5XbQN4zB"
