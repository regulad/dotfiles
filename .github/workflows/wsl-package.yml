name: Package WSL distribution

# Repackages an already-published container image as a WSL distribution
# tarball (a .wsl file -- see https://learn.microsoft.com/windows/wsl/build-custom-distro).
#
# Called once per flavor from docker-publish.yml. Kept as a reusable workflow
# rather than inlined twice because the step list is long enough that the
# duplication would drift.
#
# The image's root filesystem is exported, edited in a chroot (keychain is
# removed -- see that step), and repacked with a distribution overlay on top:
# /etc/wsl.conf, /etc/wsl-distribution.conf, /etc/oobe.sh, /etc/dotfiles-commit,
# an empty machine-id and Microsoft's unit masks.

on:
  workflow_call:
    inputs:
      flavor:
        description: Flavor name used in the output filename (e.g. "ubuntu", "fedora").
        required: true
        type: string
      image:
        description: Fully-qualified image repository, without a tag (e.g. ghcr.io/owner/repo).
        required: true
        type: string
      digest:
        description: Manifest-list digest of the image to repackage.
        required: true
        type: string

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Native per architecture, like the build jobs. This used to be one amd64
    # runner for both, back when nothing out of the image was ever executed;
    # the chroot step below now runs the image's own package manager to take
    # keychain out, and that binary has to be able to run here.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the distribution config
        uses: actions/checkout@v5.0.0
        with:
          sparse-checkout: .github/wsl
          sparse-checkout-cone-mode: false

      - name: Free up disk space
        run: |
          set -euo pipefail
          # Headroom for the exported rootfs tar, which the export step writes
          # to disk and then asserts it has room for. None of these are used by
          # this job. (The figure this comment used to quote, ~14 GB free, is
          # long stale: a current ubuntu-24.04 runner reports 145G total and
          # 108G free after these removals.)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Install crane, pigz, bsdtar and getcap
        env:
          CRANE_VERSION: "0.21.9"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # pigz: gzip is single-threaded and this is several GB.
          # libarchive-tools: provides bsdtar, which can filter a tar *stream*.
          # libcap2-bin: getcap, to check file capabilities survive the
          # extract-and-repack round trip (see the verify step).
          sudo apt-get install -y -qq pigz libarchive-tools libcap2-bin
          # crane's release assets are named for the runner's own machine.
          case "$(uname -m)" in
            x86_64) crane_arch=x86_64 ;;
            aarch64) crane_arch=arm64 ;;
            *) echo "::error::no crane build for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Authenticate to the registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: crane auth login ghcr.io -u "$ACTOR" --password-stdin <<< "$TOKEN"

      - name: Stage the distribution overlay
        env:
          FLAVOR: ${{ inputs.flavor }}
          # In a reusable workflow github.sha is the caller's: the commit the
          # image itself was built from.
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/etc/systemd/system" "$stage/etc/systemd/user"

          # CR is stripped on the way in. .gitattributes is `* text=auto`, so
          # the blobs are stored LF and a Linux checkout gets LF -- this is
          # insurance, not a live fix. It is cheap insurance though: a CRLF
          # oobe.sh fails at the shebang, WSL reads that as a failed first run,
          # and the user cannot open a shell in the instance at all.
          sed 's/\r$//' .github/wsl/wsl.conf > "$stage/etc/wsl.conf"
          chmod 0644 "$stage/etc/wsl.conf"
          sed 's/\r$//' .github/wsl/oobe.sh > "$stage/etc/oobe.sh"
          chmod 0755 "$stage/etc/oobe.sh"
          sed -e 's/\r$//' -e "s/@FLAVOR@/${FLAVOR}/g" .github/wsl/wsl-distribution.conf \
            > "$stage/etc/wsl-distribution.conf"
          chmod 0644 "$stage/etc/wsl-distribution.conf"

          # Which commit of this repo the instance was built from, readable
          # from inside it (`cat /etc/dotfiles-commit`) and from Windows
          # (`wsl -d regulad-<flavor> cat /etc/dotfiles-commit`). Nothing in WSL
          # records where an imported instance came from, so the image carries
          # it. One line, the full 40-character SHA.
          printf '%s\n' "$COMMIT" > "$stage/etc/dotfiles-commit"
          chmod 0644 "$stage/etc/dotfiles-commit"

          # Nothing staged may contain a CR; see above.
          if grep -rlU $'\r' "$stage" 2>/dev/null | grep -q .; then
            echo "::error::CR found in staged overlay files"
            grep -rlU $'\r' "$stage"
            exit 1
          fi

          # An EMPTY /etc/machine-id, not an absent one, and not the image's.
          #
          # Absent is actively broken: systemd then sees ConditionFirstBoot=yes
          # and starts systemd-firstboot.service, which on Fedora runs
          #   systemd-firstboot --prompt-locale --prompt-keymap-auto
          #                     --prompt-timezone --prompt-root-password
          # and blocks forever waiting for input nobody can give. That wedges
          # sysinit.target, so dbus-broker never starts, so systemctl cannot
          # reach the system bus, so every user unit this repo installs --
          # tmux@default, podman.socket, ssh-agent-relay -- is dead. Caught by
          # importing a real test tarball: /sbin/init failed to start within
          # 10000ms, with systemd-firstboot.service stuck in "start running".
          #
          # Keeping the image's id is also wrong: every instance imported from
          # this tarball would share one machine id.
          #
          # Empty is the documented "generate a fresh one at boot" state --
          # see machine-id(5) -- so each instance gets its own.
          : > "$stage/etc/machine-id"
          chmod 0444 "$stage/etc/machine-id"

          # Microsoft's list of units that misbehave under WSL. Masked with a
          # symlink to /dev/null rather than deleted: masking is reversible by
          # the user (`systemctl unmask`) and cannot break a unit elsewhere
          # that has a Requires= on one of them, which deleting the unit file
          # would. /etc/systemd overrides /usr/lib/systemd, so these win.
          #
          # systemd-resolved and systemd-networkd in particular fight WSL for
          # /etc/resolv.conf, which [network] generateResolvConf=true in
          # wsl.conf already owns.
          for unit in \
              systemd-firstboot.service \
              systemd-resolved.service \
              systemd-networkd.service \
              NetworkManager.service \
              systemd-tmpfiles-setup.service \
              systemd-tmpfiles-clean.service \
              systemd-tmpfiles-clean.timer \
              systemd-tmpfiles-setup-dev-early.service \
              systemd-tmpfiles-setup-dev.service \
              tmp.mount
          do
            ln -sf /dev/null "$stage/etc/systemd/system/$unit"
          done

          # The same guidance applies to the user manager, where the tmpfiles
          # units also exist. Masking them here matters more than usual for
          # this repo, because every user unit it installs -- tmux@default,
          # podman.socket, ssh-agent-relay -- lives in that same manager.
          for unit in \
              systemd-tmpfiles-setup.service \
              systemd-tmpfiles-clean.service \
              systemd-tmpfiles-clean.timer
          do
            ln -sf /dev/null "$stage/etc/systemd/user/$unit"
          done

          # Everything staged above is created by the runner user -- uid 1001
          # on GitHub-hosted runners -- and `bsdtar --numeric-owner` records
          # that uid faithfully. Nothing here is read back by a later step, so
          # handing the whole stage to root costs nothing.
          #
          # This matters more than a stray uid on a config file, because the
          # overlay's entries include the directories /etc, /etc/systemd,
          # /etc/systemd/system and /etc/systemd/user themselves. Extracting it
          # therefore *replaces* those directories' root ownership. Observed on
          # a real import of the 2026-08-21 build: 21 entries owned 1001:1001,
          # /etc among them, against an image with no uid 1001 at all -- so
          # creating any account at uid 1001 would have handed it /etc.
          sudo chown -R 0:0 "$stage"

          echo "STAGE=$stage" >> "$GITHUB_ENV"
          echo "--- overlay ---"
          # %u:%g included deliberately: the ownership bug above survived
          # because this listing showed only type and mode.
          find "$stage" -mindepth 1 -printf '%y %M %u:%g %P\n' | sort

      # Deliberately split from the repack below. This used to be one
      # `crane | bsdtar | pigz` pipeline retried as a unit, which meant a
      # dropped connection also discarded however much repacking had already
      # been done alongside it. Run 32369485769 spent all three of its attempts
      # that way on ubuntu/amd64 -- ~9 minutes each, "unexpected EOF" -- while
      # the other three legs of the same matrix passed. Nothing is wrong with
      # that image: ghcr serves its layer's declared 5,872,882,259 bytes and
      # answers range requests for the tail, so the blob is intact and this is
      # a flaky multi-GB stream. Splitting does not make the stream itself more
      # reliable; it makes an attempt cheap enough to afford more of them, and
      # it stops a network fault from being reported as a packaging fault.
      - name: Export the root filesystem
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          ARCH: ${{ matrix.arch }}
          # Force net/http down to HTTP/1.1. go-containerregistry drops large
          # blobs mid-stream over HTTP/2 with "stream error: stream ID 1;
          # PROTOCOL_ERROR received from peer" -- google/go-containerregistry#2084,
          # open, with no crane flag for it. These images are close to the worst
          # case: the Dockerfiles put every install in a single layer (buildx in
          # GHA cannot squash), so the whole rootfs is one multi-GB blob in one
          # stream. Run 31428570880 lost all four legs to this ~5 minutes in.
          GODEBUG: http2client=0
        run: |
          set -euo pipefail

          # `crane export` writes the *flattened* filesystem -- the equivalent
          # of `docker export` -- so there are no layer whiteouts to interpret
          # and the image is never materialised as an image on disk. The
          # flattened tar now does land on disk, which the previous version of
          # this step avoided on the grounds that it would not fit. It fits
          # comfortably: after the cleanup step above, df reports 108G free of
          # 145G, against a ~5.9 GB compressed layer. Asserted rather than
          # assumed, because the whole point of writing it down is that a
          # future runner change should fail here and not somewhere confusing.
          avail=$(df --output=avail -k / | tail -1 | tr -d ' ')
          if [ "$avail" -lt 41943040 ]; then
            echo "::error::only $((avail / 1024 / 1024)) GiB free, need 40 GiB for the exported tar plus the packed output"
            exit 1
          fi

          # Retried whole rather than resumed: crane cannot restart a blob
          # mid-stream, so a dropped connection means starting over. Five
          # attempts rather than three, because HTTP/1.1 (see GODEBUG above)
          # was expected to fix the common case and demonstrably has not, and
          # because an attempt no longer costs any repack work.
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::export attempt ${attempt}/${attempts}"
            if crane --platform "linux/${ARCH}" export "${IMAGE}@${DIGEST}" rootfs.tar; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            rm -f rootfs.tar
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::rootfs export failed after ${attempts} attempts"
              exit 1
            fi
            echo "warning: export attempt ${attempt} failed, retrying" >&2
            sleep $((attempt * 30))
          done

          echo "exported $(stat -c %s rootfs.tar) bytes"
          df -h /

      # keychain comes out of the WSL tarball here, with the image's own
      # package manager, rather than at first run. The image is built in
      # Docker, where WSL cannot be told apart, so its package lists install
      # keychain like any Linux host's -- and Fedora's package ships
      # /etc/profile.d/keychain.sh, a login hook that runs
      # `keychain --immediate` over every key in ~/.ssh and hung the first shell
      # after every `wsl --shutdown` on an invisible passphrase prompt. WSL has
      # no use for it: the Windows agent is relayed in (ssh-agent-relay.service),
      # .commonprofile points SSH_AUTH_SOCK there, and the package lists leave
      # keychain out once they run inside WSL, so it does not come back.
      - name: Remove keychain in a chroot
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rootfs"
          sudo mkdir -p "$root"

          # As root, bsdtar restores owners, modes, ACLs and extended
          # attributes -- which carry file capabilities -- by default;
          # --numeric-owner keeps the image's uids and gids rather than mapping
          # them by name onto this runner's /etc/passwd.
          sudo bsdtar -xpf rootfs.tar --numeric-owner -C "$root"
          rm -f rootfs.tar
          df -h /

          # File capabilities, recorded here so the verify step can check the
          # repack kept every one of them.
          { sudo getcap -r "$root" 2>/dev/null || true; } | sed "s|^$root/||" | sort > "$RUNNER_TEMP/caps.txt"
          echo "file capabilities in the image: $(wc -l < "$RUNNER_TEMP/caps.txt")"
          cat "$RUNNER_TEMP/caps.txt"

          # The image's own rpm/dpkg run in the chroot, against its own package
          # database -- which this Ubuntu runner's tools could not read
          # (Fedora's rpmdb is sqlite). /proc and /dev are what package
          # maintainer scripts expect; both are unmounted again before anything
          # is packed, and the step refuses to continue if either is not.
          release() {
            for m in dev proc; do
              if mountpoint -q "$root/$m"; then sudo umount "$root/$m"; fi
            done
          }
          trap release EXIT
          sudo mount -t proc proc "$root/proc"
          sudo mount --bind /dev "$root/dev"

          if sudo chroot "$root" rpm -q keychain >/dev/null 2>&1; then
            sudo chroot "$root" rpm -e keychain
            echo "removed keychain (rpm)"
          elif sudo chroot "$root" dpkg -s keychain >/dev/null 2>&1; then
            # purge, not remove: remove leaves conffiles under /etc behind.
            sudo chroot "$root" dpkg --purge keychain
            echo "purged keychain (dpkg)"
          else
            echo "keychain is not installed in this image"
          fi

          release
          trap - EXIT
          if findmnt -rn -o TARGET | grep -q "^$root/"; then
            echo "::error::still mounted inside the rootfs; refusing to pack the runner's /proc or /dev"
            findmnt -rn -o TARGET | grep "^$root/"
            exit 1
          fi

          # Fedora's hook is a %config(noreplace) file: rpm deletes it on erase
          # only while unmodified (an edited copy survives as .rpmsave) and has
          # no flag to force that, so whatever is left goes by name.
          sudo rm -f "$root"/etc/profile.d/keychain.sh "$root"/etc/profile.d/keychain.csh \
                     "$root"/etc/profile.d/keychain.sh.rpmsave "$root"/etc/profile.d/keychain.csh.rpmsave

          for gone in usr/bin/keychain etc/profile.d/keychain.sh; do
            if [ -e "$root/$gone" ]; then
              echo "::error::$gone is still in the rootfs"
              exit 1
            fi
          done

          echo "ROOTFS=$root" >> "$GITHUB_ENV"

      - name: Repack as a WSL tarball
        id: pack
        env:
          ARCH: ${{ matrix.arch }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          set -euo pipefail
          out="regulad-${FLAVOR}-${ARCH}.wsl"

          # No network in this step, and so deliberately no retry loop: with
          # the download hoisted out, anything that fails here is a real defect
          # and should be read as one rather than hidden behind a second try.
          #
          # bsdtar packs the rootfs the chroot step extracted and edited -- its
          # top-level entries named relatively, so the tar is rooted at / with
          # no ./ prefix -- dropping files WSL populates itself at first boot.
          # As root it archives extended attributes (file capabilities) by
          # default; the verify step checks they made it.
          #
          # Verified against a real registry image: etc/hosts and etc/machine-id
          # *are* baked into the image and really do get stripped here.
          # etc/resolv.conf and .dockerenv are not -- Docker injects those into
          # a container at runtime, so a registry-side export never sees them --
          # but they stay listed because they would appear the moment anyone
          # swapped crane for `docker export`, and they cannot be deleted from a
          # running container either (Docker bind-mounts them, so `rm` fails
          # with "Device or resource busy"). WSL replaces resolv.conf with a
          # symlink to /mnt/wsl/resolv.conf on first boot, and Microsoft
          # documents that a distribution tar must not ship one.
          #
          # No --format: bsdtar's default (restricted pax) preserves the
          # extended attributes that carry file capabilities. Forcing gnutar
          # would silently drop them.
          #
          # The `-C "$STAGE" etc` operand after the rootfs entries appends the
          # distribution overlay staged above. Order is load-bearing: tar has
          # no notion of replacing an entry, so a later entry simply overwrites
          # an earlier one at extraction time, and the overlay has to come
          # second to win. Verified that it does, and that /dev/null mask
          # symlinks survive the round trip as symlinks rather than being
          # dereferenced.
          cd "$ROOTFS"
          mapfile -t top < <(ls -A)
          sudo bsdtar --numeric-owner -cf - \
              --exclude '.dockerenv' \
              --exclude 'etc/resolv.conf' \
              --exclude 'etc/hostname' \
              --exclude 'etc/hosts' \
              "${top[@]}" \
              -C "$STAGE" etc \
            | pigz -9 > "$GITHUB_WORKSPACE/$out"
          cd "$GITHUB_WORKSPACE"

          # Several times larger than everything downstream of it, and of no
          # further use once repacked.
          sudo rm -rf "$ROOTFS"

          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c %s "$out")" >> "$GITHUB_OUTPUT"

      - name: Verify the tarball
        env:
          OUT: ${{ steps.pack.outputs.out }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          pigz -dc "$OUT" | tar -tf - > entries.txt

          leftovers=$(grep -xE '\.dockerenv|etc/(resolv\.conf|hostname|hosts)' entries.txt || true)
          if [ -n "$leftovers" ]; then
            echo "::error::tarball still ships files WSL populates at first boot:"
            printf '%s\n' "$leftovers"
            exit 1
          fi

          # The root of the tar must be the root of the filesystem, not a
          # directory containing it.
          for required in etc/passwd etc/os-release etc/shadow; do
            grep -qx "$required" entries.txt || {
              echo "::error::missing $required -- tar is not rooted at /"
              exit 1
            }
          done

          # The overlay has to have survived the repack, and the masks have to
          # still be symlinks rather than dereferenced copies of /dev/null.
          for required in etc/wsl.conf etc/wsl-distribution.conf etc/oobe.sh \
                          etc/dotfiles-commit \
                          etc/systemd/system/systemd-resolved.service \
                          etc/systemd/user/systemd-tmpfiles-clean.timer; do
            grep -qx "$required" entries.txt || {
              echo "::error::distribution overlay is missing $required"
              exit 1
            }
          done

          # The provenance file has to name this run's commit and nothing else.
          shipped=$(pigz -dc "$OUT" | bsdtar -xOf - 'etc/dotfiles-commit')
          if [ "$shipped" != "$COMMIT" ]; then
            echo "::error::etc/dotfiles-commit is '${shipped}', expected '${COMMIT}'"
            exit 1
          fi

          # keychain and its login hook must not ship (see the chroot step).
          if grep -xE 'usr/bin/keychain|etc/profile\.d/keychain\.c?sh(\.rpmsave)?' entries.txt; then
            echo "::error::keychain is still in the tarball"
            exit 1
          fi

          # The extract-and-repack round trip must keep every file capability
          # the image had (rootless podman needs newuidmap/newgidmap's, for
          # one). Pull just those files back out as root, which restores
          # extended attributes, and compare with what the chroot step saw.
          mapfile -t capfiles < <(cut -d' ' -f1 "$RUNNER_TEMP/caps.txt")
          if [ "${#capfiles[@]}" -gt 0 ]; then
            t="$RUNNER_TEMP/capcheck"
            sudo mkdir -p "$t"
            pigz -dc "$OUT" | sudo bsdtar -xpf - --numeric-owner -C "$t" "${capfiles[@]}"
            { sudo getcap -r "$t" 2>/dev/null || true; } | sed "s|^$t/||" | sort > caps-after.txt
            sudo rm -rf "$t"
            if ! diff -u "$RUNNER_TEMP/caps.txt" caps-after.txt; then
              echo "::error::file capabilities changed in the repack"
              exit 1
            fi
          fi
          echo "file capabilities preserved: ${#capfiles[@]}"

          pigz -dc "$OUT" | bsdtar -tvf - \
            'etc/wsl.conf' 'etc/wsl-distribution.conf' 'etc/oobe.sh' \
            'etc/systemd/system/systemd-resolved.service' > overlay.txt
          cat overlay.txt
          grep -q '^lrwxr.*systemd-resolved\.service -> /dev/null' overlay.txt || {
            echo "::error::unit masks did not survive as symlinks to /dev/null"
            exit 1
          }
          grep -qE '^-rwxr-xr-x.*etc/oobe\.sh' overlay.txt || {
            echo "::error::oobe.sh is not executable; WSL would fail the first run"
            exit 1
          }

          # machine-id must be present AND zero length. Absent means systemd
          # runs the interactive systemd-firstboot and the instance never
          # finishes booting; non-empty means every instance shares an id.
          # There are deliberately TWO etc/machine-id entries: the image's and
          # the empty overlay one. The image's cannot simply be excluded --
          # bsdtar applies --exclude to the staged `-C "$STAGE" etc` operand as
          # well as to the piped archive, so excluding the path drops the
          # replacement too and leaves machine-id absent, which is the hanging
          # boot this whole thing exists to avoid. Overwriting via a later
          # entry is the mechanism that works, so check the LAST one, which is
          # the one extraction actually lands.
          mid_size=$(pigz -dc "$OUT" | bsdtar -tvf - 'etc/machine-id' | awk '{print $5}' | tail -1)
          if [ -z "$mid_size" ]; then
            echo "::error::etc/machine-id is absent -- systemd-firstboot will hang the boot"
            exit 1
          fi
          if [ "$mid_size" != "0" ]; then
            echo "::error::etc/machine-id is $mid_size bytes; it must be empty"
            exit 1
          fi

          # oobe.command returning non-zero locks the user out of the shell
          # permanently, so assert the script has no way to do that.
          if grep -qE '^\s*set\s+-[a-z]*e' .github/wsl/oobe.sh; then
            echo "::error::oobe.sh must not use set -e; a non-zero exit bricks the distro"
            exit 1
          fi

          grep -q '^home/regulad\.linux/' entries.txt || {
            echo "::error::uid 1000 home directory is absent"
            exit 1
          }

          echo "entries: $(wc -l < entries.txt)"

      - name: Summarize
        env:
          OUT: ${{ steps.pack.outputs.out }}
          BYTES: ${{ steps.pack.outputs.bytes }}
          FLAVOR: ${{ inputs.flavor }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ inputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "### WSL tarball: \`${FLAVOR}\` / \`${ARCH}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${OUT}\` |"
            echo "| Compressed | $(numfmt --to=iec --suffix=B "$BYTES") |"
            echo "| Source digest | \`${DIGEST}\` |"
            echo "| Commit (\`/etc/dotfiles-commit\`) | \`${COMMIT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: wsl-${{ inputs.flavor }}-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.out }}
          # Already gzipped; re-zipping it would only burn time.
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
