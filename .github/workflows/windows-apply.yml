name: Windows apply

# Applies the dotfiles to GitHub's hosted Windows runners and fails if the
# apply does. Nothing is published: this is the Windows counterpart of
# macos-apply.yml -- that a fresh apply goes through clean, hookscripts and
# all.
#
# Two runners. windows-2025 is Windows Server 2025 on x64, build 26100: the
# same codebase as Windows 11 24H2, which is why 010-version-check's floor is
# 26100. There is no hosted x64 Windows 11 image. windows-11-arm is a real
# Windows 11 (25H2) on Arm64, so it also covers what has no win-arm64 build.
# Both run the job as an administrator with UAC prompts off, which a
# workstation does not; the prep step below makes up the rest of the
# difference.
#
# Headless and with dummy secrets, as on macOS: CHEZMOI_USE_HEADLESS leaves
# out the GUI winget packages (100, Store apps included), the Windows
# Subsystem for Android (700) and VS Code's extensions (800). CHEZMOI_USE_DUMMY
# masks every Bitwarden-backed file and the scripts that read them, and the
# apply runs with --exclude encrypted.

on:
  workflow_dispatch:
  schedule:
    # Same cadence as macos-apply.yml, for the same reason: slow upstream
    # drift, long jobs, nothing published.
    - cron: "28 4 1,15 * *"
  push:
    branches: ["master", "ci/windows-apply"]

# A newer run cancels the one it supersedes, as in macos-apply.yml.
concurrency:
  group: windows-apply
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
          - runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    # ~60 scoop packages, the headless winget set, uv/pnpm/cargo/go installs.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out the dotfiles
        uses: actions/checkout@v5.0.0

      - name: Make the runner look like a fresh Windows 11 workstation
        env:
          # Repair-WinGetPackageManager looks its release up on
          # api.github.com, whose unauthenticated limit the shared runner IPs
          # exhaust; it reads GH_TOKEN/GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $os = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          Write-Host "$($os.ProductName) $($os.DisplayVersion), build $($os.CurrentBuildNumber).$($os.UBR), $($os.InstallationType), $env:PROCESSOR_ARCHITECTURE"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, @{ n = 'FreeGiB'; e = { [math]::Round($_.Free / 1GB, 1) } }

          # The image appends `$ErrorActionPreference = "Stop"` to the
          # machine-wide PowerShell profiles. A workstation has no such line,
          # and chezmoi runs .ps1 hookscripts through Windows PowerShell
          # without -NoProfile, so with it in place every non-terminating
          # error in them would stop the script.
          foreach ($profilePath in "$env:SystemRoot\System32\WindowsPowerShell\v1.0\profile.ps1", "$PSHOME\profile.ps1") {
            if (Test-Path $profilePath) {
              Write-Host "--- $profilePath"
              Get-Content $profilePath | Write-Host
              (Get-Content $profilePath) | Where-Object { $_ -notmatch 'ErrorActionPreference' } | Set-Content $profilePath
            }
          }

          # Room on C:, which windows-2025 has little of (~30 GiB free) and
          # where scoop, the winget packages and the uv/pnpm trees all land.
          # The Android SDK is the biggest thing the image ships that a fresh
          # Windows has no trace of.
          if (Test-Path C:\Android) {
            cmd /c rmdir /s /q C:\Android
          }

          # winget: windows-2025 has the one Server shipped with, too old to
          # be what a current Windows 11 has; windows-11-arm has none.
          # Microsoft's own module installs or updates it, dependencies
          # included.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.WinGet.Client -Repository PSGallery -Force -Scope AllUsers
          Repair-WinGetPackageManager -Latest -Force
          $windowsApps = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
          $wingetLinks = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
          $env:PATH = "$windowsApps;$wingetLinks;$env:PATH"
          winget --version

          # Windows Update. The image disables the service and points the
          # policies away from it; a workstation has neither, and 102 installs
          # the OpenSSH.Server capability, a Feature on Demand that comes from
          # Windows Update when the image does not already carry it
          # (windows-11-arm: ~15 minutes).
          $wuPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          if (Test-Path $wuPolicy) {
            Get-ItemProperty $wuPolicy | Format-List | Out-String | Write-Host
            Remove-Item -Path $wuPolicy -Recurse -Force
          }
          Set-Service -Name wuauserv -StartupType Manual

          # README's NT install: scoop first, then chezmoi and git from it.
          # get.scoop.sh refuses an elevated shell without -RunAsAdmin.
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile $installer
          & $installer -RunAsAdmin
          $shims = Join-Path $HOME 'scoop\shims'
          $env:PATH = "$shims;$env:PATH"
          scoop install chezmoi git

          # sudo. The hookscripts elevate with Windows' own, inline (000-
          # registry sets the mode): it runs the command line it is given in
          # the calling console and returns its exit code. Server has none,
          # and on windows-11-arm it refuses to run from the runner's
          # non-interactive session (0x800710E0, "The operator or
          # administrator has refused the request"). gsudo is no substitute:
          # called from PowerShell, it hands the command to another
          # PowerShell, which expands the `$ that the hookscripts escape in
          # their -Command strings. The job is already elevated, so all sudo
          # has to do is run the command line verbatim; this pass-through
          # does that, ahead of System32 on the Machine PATH (what refreshenv
          # rebuilds PATH from) and on this job's.
          $sudoDir = 'C:\ci-sudo'
          New-Item -ItemType Directory -Force -Path $sudoDir | Out-Null
          $sudoSource = @'
          using System;
          using System.Collections.Generic;
          using System.Diagnostics;
          using System.IO;

          public static class Sudo
          {
              public static int Main()
              {
                  // Everything after argv[0], exactly as it was passed.
                  string line = Environment.CommandLine;
                  int i = 0;
                  if (line.StartsWith("\"")) { i = line.IndexOf('"', 1) + 1; }
                  else { while (i < line.Length && line[i] != ' ' && line[i] != '\t') i++; }
                  string rest = line.Substring(i).TrimStart(' ', '\t');
                  if (rest.Length == 0) { Console.Error.WriteLine("usage: sudo <command> [arguments]"); return 1; }

                  string first, args;
                  if (rest[0] == '"')
                  {
                      int j = rest.IndexOf('"', 1);
                      if (j < 0) j = rest.Length;
                      first = rest.Substring(1, j - 1);
                      args = j < rest.Length ? rest.Substring(j + 1) : "";
                  }
                  else
                  {
                      int j = 0;
                      while (j < rest.Length && rest[j] != ' ' && rest[j] != '\t') j++;
                      first = rest.Substring(0, j);
                      args = rest.Substring(j);
                  }

                  // Batch files (scoop's shims among them) and cmd built-ins go
                  // through cmd, as CreateProcess itself would for a batch file.
                  string exe = Resolve(first);
                  ProcessStartInfo psi;
                  if (exe == null || exe.EndsWith(".cmd", StringComparison.OrdinalIgnoreCase) || exe.EndsWith(".bat", StringComparison.OrdinalIgnoreCase))
                      psi = new ProcessStartInfo(Environment.GetEnvironmentVariable("ComSpec") ?? "cmd.exe", "/d /s /c \"" + rest + "\"");
                  else
                      psi = new ProcessStartInfo(exe, args.TrimStart(' ', '\t'));
                  psi.UseShellExecute = false;
                  using (Process p = Process.Start(psi)) { p.WaitForExit(); return p.ExitCode; }
              }

              static string Resolve(string name)
              {
                  string[] exts = (Environment.GetEnvironmentVariable("PATHEXT") ?? ".COM;.EXE;.BAT;.CMD").Split(new[] { ';' }, StringSplitOptions.RemoveEmptyEntries);
                  List<string> dirs = new List<string>();
                  if (name.IndexOfAny(new[] { '\\', '/', ':' }) >= 0) dirs.Add("");
                  else
                  {
                      dirs.Add(Environment.CurrentDirectory);
                      dirs.AddRange((Environment.GetEnvironmentVariable("PATH") ?? "").Split(new[] { ';' }, StringSplitOptions.RemoveEmptyEntries));
                  }
                  foreach (string d in dirs)
                  {
                      try
                      {
                          string b = d.Length == 0 ? name : Path.Combine(d.Trim('"'), name);
                          if (Path.HasExtension(name) && File.Exists(b)) return Path.GetFullPath(b);
                          foreach (string e in exts) if (File.Exists(b + e)) return Path.GetFullPath(b + e);
                      }
                      catch (ArgumentException) { }
                  }
                  return null;
              }
          }
          '@
          # Windows PowerShell's Add-Type can still emit a console exe.
          powershell.exe -NoProfile -Command {
            param($Source, $Output)
            Add-Type -TypeDefinition $Source -OutputAssembly $Output -OutputType ConsoleApplication
          } -args $sudoSource, "$sudoDir\sudo.exe"
          $env:PATH = "$sudoDir;$env:PATH"
          sudo cmd /c "echo sudo pass-through works"

          # The Machine PATH. The image's runs to thousands of characters with
          # the toolchains it ships; a fresh Windows has the System32-rooted
          # five. GnuPG's installer, which Gpg4win runs, refuses to add itself
          # to a Machine PATH longer than 2047 characters, with a message box
          # that /S does not suppress (g4wihelp.c, PATH_LENGTH_LIMIT), and the
          # apply hung there. Rebuilt to a fresh install's (PowerShell 7 kept:
          # the image registered it, so winget only ever upgrades it in place
          # and would not put it back), with the sudo pass-through first. This
          # job's steps keep the PATH they started with; refreshenv and a new
          # logon see this one.
          $envKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $imagePath = (Get-Item $envKey).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          Write-Host "image Machine PATH ($($imagePath.Length) characters): $imagePath"
          $freshPath = '%SystemRoot%\system32;%SystemRoot%;%SystemRoot%\System32\Wbem;%SYSTEMROOT%\System32\WindowsPowerShell\v1.0\;%SYSTEMROOT%\System32\OpenSSH\;%ProgramFiles%\PowerShell\7\'
          Set-ItemProperty -Path $envKey -Name Path -Value "$sudoDir;$freshPath" -Type ExpandString
          Write-Host "User PATH: $([Environment]::GetEnvironmentVariable('PATH', 'User'))"

          # A logon would put these on PATH from the registry; later steps
          # only see what is added here.
          $shims, $wingetLinks, $windowsApps, $sudoDir | Add-Content -Path $env:GITHUB_PATH
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, @{ n = 'FreeGiB'; e = { [math]::Round($_.Free / 1GB, 1) } }

      - name: Apply
        env:
          CHEZMOI_USE_DUMMY: "1"
          CHEZMOI_USE_HEADLESS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $HOME '.local\share\chezmoi'
          New-Item -ItemType Directory -Force -Path (Split-Path $source) | Out-Null
          Copy-Item -Recurse -Path $env:GITHUB_WORKSPACE -Destination $source
          chezmoi init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An installer that waits on a prompt nobody can see stalls the
          # apply with no output until the job times out. Every 15 minutes
          # this lists the newest processes, so the log says what it was
          # stuck on.
          $watch = @'
          $start = Get-Date
          while ($true) {
            Start-Sleep -Seconds 900
            [Console]::Out.WriteLine("watchdog: still applying after $([int]((Get-Date) - $start).TotalMinutes) minutes; newest processes:")
            [Console]::Out.WriteLine((Get-CimInstance Win32_Process | Sort-Object CreationDate -Descending | Select-Object -First 15 |
              Format-Table ProcessId, ParentProcessId, Name, CommandLine -Wrap | Out-String -Width 400))
          }
          '@
          # -OutputFormat Text: with -EncodedCommand and no console on stdout,
          # pwsh otherwise writes CLIXML.
          $watchdog = Start-Process -FilePath pwsh -NoNewWindow -PassThru -ArgumentList '-NoProfile', '-OutputFormat', 'Text', '-EncodedCommand', ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($watch)))
          # --force: no TTY to ask on about files the image already has.
          # --keep-going: every failing hookscript in one run, not just the
          # first; the apply still exits non-zero if any failed.
          chezmoi apply --force --keep-going --exclude encrypted
          $code = $LASTEXITCODE
          Stop-Process -Id $watchdog.Id -ErrorAction SilentlyContinue
          exit $code

      # TEMPORARY (ci/windows-apply iteration): 115's `wsl --update` failed
      # silently on windows-2025, and 110's `sudo wsl.exe --install
      # --no-distribution` got the inbox stub's "not installed" reply on
      # windows-11-arm. After the apply, so it cannot change what the apply
      # saw.
      - name: "Diagnose: WSL"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          $env:WSL_UTF8 = '1'
          Get-CimInstance Win32_ComputerSystem | Format-List HypervisorPresent | Out-String | Write-Host
          Get-CimInstance Win32_Processor | Format-List VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions, VMMonitorModeExtensions | Out-String | Write-Host
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Lxss\MSI' -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
          Write-Host '--- the sudo pass-through and what it starts'
          sudo powershell -NoProfile -Command "[Environment]::Is64BitProcess; `$env:PROCESSOR_ARCHITECTURE; (Get-Process -Id `$PID).Path"
          sudo cmd /c "echo %PROCESSOR_ARCHITECTURE% & where wsl"
          foreach ($line in '--version', '--status', '--update', '--update --web-download', '--install --no-distribution') {
            Write-Host "--- wsl $line"
            $wslArgs = $line -split ' '
            & "$env:SystemRoot\System32\wsl.exe" @wslArgs 2>&1 | Out-String | Write-Host
            Write-Host "exit $LASTEXITCODE"
          }

      - name: Check what a new logon would find
        if: ${{ !cancelled() }}
        run: |
          # PATH as a fresh logon builds it, from the registry, rather than
          # the one this job started with: installers write there, not here.
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'User')
          $versionArgs = @{ go = 'version'; java = '-version' }
          function Show-Tool([string]$Name) {
            $command = Get-Command $Name -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $command) { return $false }
            $arg = if ($versionArgs.ContainsKey($Name)) { $versionArgs[$Name] } else { '--version' }
            $line = (& $command.Source $arg 2>&1 | Select-Object -First 1) -as [string]
            Write-Host ("{0,-12} {1}  ({2})" -f $Name, $line, $command.Source)
            return $true
          }
          $missing = @()
          $tools = @(
            'chezmoi', 'scoop', 'git', 'winget', 'pwsh', 'gpg', 'uv', 'pnpm', 'node', 'go', 'cargo', 'java', 'vim', 'nvim', 'claude'
            # the IaC/YAML set
            'tofu', 'sops', 'age', 'age-keygen', 'tflint', 'jq', 'yq', 'yamllint', 'pre-commit', 'retry'
          )
          foreach ($tool in $tools) {
            if (-not (Show-Tool $tool)) { $missing += $tool }
          }
          # telnet is Windows' own Telnet Client (040-telnet-client), not a
          # scoop package. Only its location is checked: run, it would wait
          # for input.
          $telnet = (Get-Command telnet -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          Write-Host ("{0,-12} {1}" -f 'telnet', $telnet)
          if ($telnet -ne "$env:SystemRoot\System32\telnet.exe") { $missing += "telnet (System32)" }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, @{ n = 'FreeGiB'; e = { [math]::Round($_.Free / 1GB, 1) } }
          if ($missing) {
            Write-Host "error: not on a new logon's PATH: $($missing -join ', ')"
            exit 1
          }
