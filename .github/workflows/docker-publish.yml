name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
  schedule:
    - cron: "28 4 * * 2,6"
  push:
    branches: ["master"]

jobs:
  # docker/github-builder handles checkout (via BuildKit git-context), buildx,
  # registry login, metadata, native per-platform builds (dispatching arm64 to
  # GitHub's real arm64 runners -- no QEMU), manifest-list merging, and signing
  # -- all internally. https://github.com/docker/github-builder
  #
  # note: env context isn't available inside a reusable workflow call's
  # with:/secrets: blocks, so ghcr.io/${{ github.repository }} is inlined
  # below rather than pulled from a top-level env: block.
  #
  # These are two distinctly-named jobs rather than one matrixed job because
  # tag-ubuntu-unsuffixed below needs needs.build-ubuntu.outputs.digest
  # unambiguously -- a matrixed job's outputs aren't reliably addressable
  # per-combination.
  build-ubuntu:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      # sign defaults to "auto", which signs iff push is true -- matches the
      # prior workflow's "don't sign on PRs" behavior without needing to
      # hand-condition it here (and hard-fails if forced true while push is
      # false, which happens on PR events).
      context: "."
      file: "./Dockerfile.ubuntu"
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ubuntu
      cache-mode: max
      build-args: |
        USERNAME=regulad.linux
        UID=1000
        GROUPNAME=regulad.linux
        GID=1000
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        suffix=-ubuntu,onlatest=true
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=schedule
        type=ref,event=branch
        type=ref,event=tag
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-fedora:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: "."
      file: "./Dockerfile.fedora"
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: fedora
      cache-mode: max
      build-args: |
        USERNAME=regulad.linux
        UID=1000
        GROUPNAME=regulad.linux
        GID=1000
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        suffix=-fedora,onlatest=true
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=schedule
        type=ref,event=branch
        type=ref,event=tag
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Aliases the ubuntu leg's already-pushed manifest list under the unsuffixed
  # name too (e.g. ghcr.io/x:latest alongside ghcr.io/x:latest-ubuntu, same
  # digest) via `docker buildx imagetools create`, which only copies manifest
  # references in the registry -- no rebuild. This is what gives us 3 tag
  # families ("", "-ubuntu", "-fedora") from only 2 real builds. No re-signing
  # needed: github-builder's attestations are keyed to the image digest, which
  # is unchanged by adding another tag pointing at it.
  tag-ubuntu-unsuffixed:
    needs: build-ubuntu
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log into registry ghcr.io
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Extract unsuffixed Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Alias the ubuntu manifest under the unsuffixed tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ needs.build-ubuntu.outputs.digest }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "ghcr.io/${{ github.repository }}@${DIGEST}"

  # Repackages each published image as a WSL distribution tarball (.wsl), one
  # per flavor per architecture. These consume the manifest that was just
  # pushed -- addressed by digest, so they package exactly the image this run
  # produced rather than whatever a tag happens to point at by then.
  #
  # See .github/workflows/wsl-package.yml for what is and isn't in the result:
  # notably it ships no /etc/wsl.conf or /etc/wsl-distribution.conf yet, so an
  # imported instance starts as root with systemd off.
  package-wsl-ubuntu:
    needs: build-ubuntu
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/wsl-package.yml
    with:
      flavor: ubuntu
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-ubuntu.outputs.digest }}

  package-wsl-fedora:
    needs: build-fedora
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/wsl-package.yml
    with:
      flavor: fedora
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-fedora.outputs.digest }}
