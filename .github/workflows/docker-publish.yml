name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
  schedule:
    - cron: "28 4 * * 2,6"
  # testing is where a change gets the whole pipeline before it lands on
  # master. It publishes the latest tags with -testing on the end instead
  # (latest-ubuntu-lts-testing, ...; see the build jobs), and its WSL tarballs
  # are artifacts wsl-deploy.ps1 passes over.
  # Deliberately no pull_request trigger: PRs never build here.
  push:
    branches: ["master", "testing"]

# Serialize the pipeline per branch, across push, scheduled, and manual runs.
# Each new run cancels the active run and replaces any pending run on the same
# branch; a push to testing must not cancel master's run, or the other way
# round. The two never write the same tag.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true
  queue: single

jobs:
  # docker/github-builder handles checkout (via BuildKit git-context), buildx,
  # registry login, metadata, native per-platform builds (dispatching arm64 to
  # GitHub's real arm64 runners -- no QEMU), manifest-list merging, and signing
  # -- all internally. https://github.com/docker/github-builder
  #
  # note: env context isn't available inside a reusable workflow call's
  # with:/secrets: blocks, so ghcr.io/${{ github.repository }} is inlined
  # below rather than pulled from a top-level env: block.
  #
  # These are distinctly-named jobs rather than one matrixed job because the
  # package-wsl-* jobs below need their build's digest unambiguously -- a
  # matrixed job's outputs aren't reliably addressable per-combination.
  #
  # Two consequences of that git-context checkout, both worth knowing before
  # touching the Dockerfiles' COPY or the .dockerignore:
  #
  #   1. .dockerignore is NOT applied. BuildKit skips it entirely for remote git
  #      contexts -- docker/cli#2827, docker/buildx#2353 -- so every path listed
  #      in ours ships inside the image anyway. Verified against a live import of
  #      the 2026-08-27 build: .github/, .gitattributes and .gitignore are all
  #      present under ~/.local/share/chezmoi despite all three being listed,
  #      while .claude/ (untracked locally) is absent -- which is itself the
  #      proof that the context is the git tree and not a path. .dockerignore
  #      only bites a local `docker build .`; nothing here may depend on it.
  #
  #   2. The .git directory does not survive: BuildKit strips it from a git
  #      context unless BUILDKIT_CONTEXT_KEEP_GIT_DIR=1 is passed as a build-arg.
  #      That flag is not the fix it looks like. What it keeps is BuildKit's own
  #      clone -- a detached, shallow HEAD with no local branch and no upstream,
  #      which is precisely the state `git pull --autostash --rebase` refuses
  #      ("You are not currently on a branch"). That pull is what `chezmoi
  #      update` runs, so the flag on its own still would not let an image pull
  #      itself forward; it would need a repair step to create a branch and set
  #      its upstream.
  #
  # What the images actually ship is an empty repo, not no repo: `chezmoi init`
  # with no repo argument runs its own `git init` in the source directory ("If
  # no repo is provided, chezmoi will initialize a new Git repository"), which
  # leaves no remote, an unborn master and every file untracked. `chezmoi
  # update` therefore cannot work in a shipped instance -- immaterial for
  # livestock containers, a real limitation for pet WSL ones. Shelved, not
  # forgotten.
  #
  # One build per release, each pushing every name it goes by. In the latest
  # family (master only):
  #
  #   latest = latest-ubuntu-lts = latest-ubuntu-26.04   build-ubuntu-26-04
  #   latest-ubuntu = latest-ubuntu-26.10                 build-ubuntu-26-10
  #   latest-fedora = latest-fedora-45                    build-fedora-45
  #   latest-fedora-44                                    build-fedora-44
  #
  # and the same suffixes on nightly (the schedule) and on <branch> (every
  # push: master-*). The testing branch gets the latest family with -testing
  # on the end instead -- latest-testing = latest-ubuntu-lts-testing =
  # latest-ubuntu-26.04-testing, and so on -- and no testing-* tags. Those
  # enable= conditions are GitHub expressions on github.ref, which Actions
  # resolves to true or false before metadata-action reads them.
  #
  # The aliases need no job of their own: a tag's own suffix= overrides the
  # flavor's in docker/metadata-action (Meta.setValue), so one meta-tags list
  # carries every name, all pushed with one digest and one signature.
  # latest=false in the flavor keeps metadata-action from adding a latest of
  # its own; the latest tags are the raw ones. There are no ref,event=tag or
  # event=pr lines: only branch pushes, the schedule and manual runs start
  # this workflow.
  #
  # Only the two builds the WSL tarballs come from have anything depending on
  # them, so a release that fails holds back no other release's tags. It
  # still marks the run failed: a reusable-workflow job cannot take
  # continue-on-error. A new release is a new job like these, with its
  # version in the build-args, cache-scope and suffixes; the newest one also
  # becomes the Dockerfile's default and takes over the unversioned suffix.
  build-ubuntu-26-04:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      # sign defaults to "auto", which signs iff push is true -- matches the
      # prior workflow's "don't sign on PRs" behavior without needing to
      # hand-condition it here (and hard-fails if forced true while push is
      # false, which happens on PR events).
      context: "."
      file: "./Dockerfile.ubuntu"
      platforms: linux/amd64,linux/arm64
      # Both architectures are required for the final manifest.
      fail-fast: true
      cache: true
      cache-scope: ubuntu-26.04
      cache-mode: max
      # RUNNER_ENVIRONMENT: github-builder only builds on GitHub-hosted
      # runners, and BuildKit does not pass the runner's environment to RUN,
      # so the variable the bottle-mirror check reads is handed in here (see
      # the ARG in the Dockerfiles). A with: block has no runner context to
      # take it from. The runner's token needs no wiring: github-builder
      # passes github.token to every build as the GIT_AUTH_TOKEN secret,
      # which the Dockerfiles mount for 00-linux/125-theos.
      build-args: |
        UBUNTU_VERSION=26.04
        USERNAME=regulad.linux
        UID=1000
        GROUPNAME=regulad.linux
        GID=1000
        RUNNER_ENVIRONMENT=github-hosted
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-testing
        type=schedule
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }}
        type=raw,value=latest,enable={{is_default_branch}},suffix=-ubuntu-lts
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-ubuntu-lts-testing
        type=schedule,suffix=-ubuntu-lts
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }},suffix=-ubuntu-lts
        type=raw,value=latest,enable={{is_default_branch}},suffix=-ubuntu-26.04
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-ubuntu-26.04-testing
        type=schedule,suffix=-ubuntu-26.04
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }},suffix=-ubuntu-26.04
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The newest Ubuntu release, an interim one while it is newer than the LTS.
  build-ubuntu-26-10:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: "."
      file: "./Dockerfile.ubuntu"
      platforms: linux/amd64,linux/arm64
      fail-fast: true
      cache: true
      cache-scope: ubuntu-26.10
      cache-mode: max
      # RUNNER_ENVIRONMENT: see build-ubuntu-26-04.
      build-args: |
        UBUNTU_VERSION=26.10
        USERNAME=regulad.linux
        UID=1000
        GROUPNAME=regulad.linux
        GID=1000
        RUNNER_ENVIRONMENT=github-hosted
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}},suffix=-ubuntu
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-ubuntu-testing
        type=schedule,suffix=-ubuntu
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }},suffix=-ubuntu
        type=raw,value=latest,enable={{is_default_branch}},suffix=-ubuntu-26.10
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-ubuntu-26.10-testing
        type=schedule,suffix=-ubuntu-26.10
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }},suffix=-ubuntu-26.10
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The newest Fedora release.
  build-fedora-45:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: "."
      file: "./Dockerfile.fedora"
      platforms: linux/amd64,linux/arm64
      # Both architectures are required for the final manifest.
      fail-fast: true
      cache: true
      cache-scope: fedora-45
      cache-mode: max
      # RUNNER_ENVIRONMENT: see build-ubuntu-26-04.
      build-args: |
        FEDORA_VERSION=45
        USERNAME=regulad.linux
        UID=1000
        GROUPNAME=regulad.linux
        GID=1000
        RUNNER_ENVIRONMENT=github-hosted
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}},suffix=-fedora
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-fedora-testing
        type=schedule,suffix=-fedora
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }},suffix=-fedora
        type=raw,value=latest,enable={{is_default_branch}},suffix=-fedora-45
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-fedora-45-testing
        type=schedule,suffix=-fedora-45
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }},suffix=-fedora-45
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The Fedora release before, for hosts that have not moved up yet.
  build-fedora-44:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: "."
      file: "./Dockerfile.fedora"
      platforms: linux/amd64,linux/arm64
      fail-fast: true
      cache: true
      cache-scope: fedora-44
      cache-mode: max
      # RUNNER_ENVIRONMENT: see build-ubuntu-26-04.
      build-args: |
        FEDORA_VERSION=44
        USERNAME=regulad.linux
        UID=1000
        GROUPNAME=regulad.linux
        GID=1000
        RUNNER_ENVIRONMENT=github-hosted
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}},suffix=-fedora-44
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/testing' }},suffix=-fedora-44-testing
        type=schedule,suffix=-fedora-44
        type=ref,event=branch,enable=${{ github.ref != 'refs/heads/testing' }},suffix=-fedora-44
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Repackages a published image as a WSL distribution tarball (.wsl), one
  # per flavor per architecture. These consume the manifest that was just
  # pushed -- addressed by digest, so they package exactly the image this run
  # produced rather than whatever a tag happens to point at by then.
  # wsl-ubuntu comes from the LTS (26.04), not the newest release: a WSL
  # instance is a pet, and an interim release is out of support in nine
  # months. wsl-fedora comes from the newest Fedora (45).
  #
  # See .github/workflows/wsl-package.yml for what is and isn't in the result:
  # notably it ships no /etc/wsl.conf or /etc/wsl-distribution.conf yet, so an
  # imported instance starts as root with systemd off.
  package-wsl-ubuntu:
    needs: build-ubuntu-26-04
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/wsl-package.yml
    with:
      flavor: ubuntu
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-ubuntu-26-04.outputs.digest }}

  package-wsl-fedora:
    needs: build-fedora-45
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/wsl-package.yml
    with:
      flavor: fedora
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-fedora-45.outputs.digest }}
