name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's minor and patch updates to GitHub Actions, security updates included,
# grouped or not. GitHub then merges each one once the required check passes (.github/settings.yml), and the merge's
# push to master starts the pipelines like any other push: docker-publish.yml, macos-apply.yml and windows-apply.yml.
# Major updates wait for a person. Dependabot watches only GitHub Actions here (dependabot.yml), so nothing else needs
# holding back.
#
# Every merge to master therefore starts the hour-plus Docker, macOS and Windows pipelines. On GitHub's free runners
# for a public repository they cost nothing today; revisit this if that changes.
#
# Auto-merge is turned on with the DEPENDABOT_MERGE_TOKEN secret, not GITHUB_TOKEN. GitHub credits the merge to whoever
# turned auto-merge on, and starts no workflows for a push credited to GITHUB_TOKEN, so the push to master would run
# nothing. The token is a fine-grained personal access token for this repository only, with read and write access to
# Contents, Pull requests and Workflows: every update here changes a workflow file, which GitHub refuses to merge for a
# token without Workflows access. It's a Dependabot secret because runs started by Dependabot can only read Dependabot
# secrets.
on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    # Only for Dependabot's own pushes. A person who pushes to its pull request takes the pull request over and merges
    # it themselves; their push's run can't read Dependabot secrets in any case.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge once the check passes
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
