# /etc/wsl-distribution.conf -- read once, at install time.
#
# @FLAVOR@ is substituted by .github/workflows/wsl-package.yml. Requires WSL
# 2.4.4 or newer; older releases ignore this file entirely.

[oobe]
# Runs on the first interactive shell. A non-zero exit here means WSL refuses
# to open a shell at all, so oobe.sh is written to always exit 0 -- see the
# header comment in .github/wsl/oobe.sh.
command = /etc/oobe.sh
# Matches the uid the Dockerfiles bake in. Written to the Lxss registry key
# once OOBE completes; /etc/wsl.conf's [user] default covers the interim.
defaultUid = 1000
# Also what makes double-clicking the .wsl in Explorer work -- Microsoft
# requires oobe.defaultName for that path to function.
defaultName = regulad-@FLAVOR@

[shortcut]
enabled = true
# No icon set: shortcut.icon wants a .ico of at most 10 MB and this repo has
# no distribution artwork. WSL falls back to its own icon.

[windowsterminal]
enabled = true
# No profileTemplate either; WSL generates a default profile. The terminal
# colours this repo cares about are set per-shell, not per-profile.
