# /etc/wsl.conf -- per-instance settings, read by WSL on every boot.
#
# Shipped inside the .wsl tarball by .github/workflows/wsl-package.yml.
# Distinct from /etc/wsl-distribution.conf, which is read once at install
# time and is the distribution author's file rather than the user's.
#
# Anything here can be edited in place on a live instance; it is not baked
# into anything. Changes take effect after `wsl --terminate <distro>`.

[boot]
# Required. Nearly everything this repo sets up on the Linux side is a
# systemd --user unit -- tmux@default.socket, podman.socket,
# ssh-agent-relay.service, and brew services' languagetool -- none of which
# exist without a real PID 1.
systemd=true

[user]
# The uid-1000 user is already baked into the image by the Dockerfiles, so
# there is no account to create and nothing to prompt for. Verified on a live
# import: this alone lands you in a shell as regulad.linux even before OOBE
# has run and written oobe.defaultUid to the registry.
default=regulad.linux

[automount]
# Windows drive letters as /mnt/c, /mnt/d, ... This is WSL's default, stated
# explicitly so a future edit has to be deliberate.
enabled=true
root=/mnt/
# metadata lets DrvFs carry real uid/gid/mode, so chmod/chown on files under
# /mnt/c persist instead of silently doing nothing.
options=metadata
# /etc/fstab is still processed; nothing here depends on it, but disabling it
# would be a surprise to anyone who later adds a mount.
mountFsTab=true

[interop]
# Needed for the Windows-side SSH agent relay: ssh-agent-relay.service execs
# npiperelay.exe, which only works if Windows binaries are executable from
# inside the distro.
enabled=true
appendWindowsPath=true

[network]
# WSL manages both. The tarball deliberately ships neither file -- Microsoft
# documents that a distribution must not include /etc/resolv.conf, and WSL
# replaces it with a symlink to /mnt/wsl/resolv.conf on first boot.
generateResolvConf=true
generateHosts=true
