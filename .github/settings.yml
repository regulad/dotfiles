# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: dotfiles
  description: >-
    Configuration of my tools using Chezmoi.
  homepage:
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: linux, shell, dotfiles, bash, zsh, ubuntu, fedora, wsl, windows, macos, chezmoi
  default_branch: master

  has_issues: true

  # No merge methods here: GitHub rejects turning all three off, so the shared
  # ones apply.
  delete_branch_on_merge: false

  enable_automated_security_fixes: false
  enable_vulnerability_alerts: false

labels:
  # Dependabot's, on its pull requests: its one ecosystem here is .github/dependabot.yml's GitHub Actions.
  - name: github_actions
    color: "000000"
    description: Pull requests that update GitHub Actions code

# master's protection is a ruleset, not branch protection: branch protection's
# required checks bind every user but an admin, and a personal repository's
# collaborators can't be admins. regubot, a collaborator declared in homelab's
# tofu/github, commits homelab's exports straight to master
# (docs/homelab-exports.md). null removes the branch protection; leaving the
# entry out would keep it.
branches:
  - name: master
    protection: null

# https://docs.github.com/en/rest/repos/rules#update-a-repository-ruleset
rulesets:
  - name: master requires actionlint
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      # What a pull request, Dependabot's included, passes before it merges:
      # the job in workflows/check.yml, by name.
      - type: required_status_checks
        parameters:
          # Off: Dependabot doesn't rebase a PR just because master moved, so a
          # stale PR would never merge.
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: actionlint
    bypass_actors:
      # The admin role: Parker still pushes to master directly.
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
      # The write role, which every collaborator of a personal repository has:
      # regubot, the only one.
      - actor_id: 4
        actor_type: RepositoryRole
        bypass_mode: always
