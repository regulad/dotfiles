{{- /* Cargo's credentials, shared like cargo-config.toml:
       dot_cargo/credentials.toml.tmpl on macOS and Linux,
       00-nt/065-tool-homes into %CARGO_HOME% on Windows.

       The crate mirror (.chezmoidata/cargo-mirror.toml) signs in with the
       Maven repository's account, the Bitwarden item that regulad-releases
       and regulad-snapshots use in dot_m2/settings.xml.tmpl. Without
       Bitwarden it falls back to the read-only guest account committed in
       .chezmoidata/brew-mirror.toml. Nexus takes HTTP Basic, and cargo sends
       a token verbatim as the Authorization header, so the token is the
       whole header value. */ -}}
{{- $user := .brewMirror.user -}}
{{- $password := .brewMirror.password -}}
{{- if not .useDummySecrets -}}
{{-   $login := (bitwarden "item" "30a0f437-a1f8-4872-9531-c087aaefa446").login -}}
{{-   $user = $login.username -}}
{{-   $password = $login.password -}}
[registry]
token = "{{- (bitwardenFields "item" "crates.io").chezmoi.value -}}"

{{ end -}}
[registries.{{ .cargoMirror.name }}]
token = "Basic {{ printf "%s:%s" $user $password | b64enc }}"
