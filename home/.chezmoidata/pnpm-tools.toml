# Global JavaScript CLIs, for .chezmoitemplates/js-tooling.sh
# (00-{linux,macos}/070-js-tooling) and 00-nt/570-pnpm-tooling. Each entry is
# the npm package `pnpm`, which `pnpm i -g` installs at its latest version,
# unless macOS and Linux take it from Homebrew (docs/tooling.md):
#
#   brew          the formula that supplies it there instead. A table picks
#                 one per brew era (the `era` of .chezmoidata/brew-tiers.toml;
#                 Linux and every unpinned Mac are "mainline"), falling back
#                 to `default`; "" leaves that era on pnpm.
#   brewCask      the same, for a cask, which wins over `brew`.
#   brewMacosMax  the newest macOS major the formula supports; newer Macs
#                 use pnpm.
#   macosMin      the oldest macOS major the package runs on at all; older
#                 Macs do not get it, from either provider.
#   os            only hosts with one of these .chezmoi.os values get it.
#   skip          hosts whose "<.chezmoi.os>/<.chezmoi.arch>" is listed do not
#                 get it, for a package with no build for that platform. On
#                 Windows chezmoi and Node both come from scoop's build for the
#                 CPU, so chezmoi's arch is also the one npm resolves for.
#
# Wherever brew supplies a package, js-tooling.sh removes a pnpm copy left
# from before, so it cannot shadow brew's on PATH.

[[pnpmTools.packages]]
pnpm = "@bitwarden/cli"
brew = "bitwarden-cli"
# Windows has scoop's bitwarden-cli (00-nt/200-scoop-install).
os = ["darwin", "linux"]

[[pnpmTools.packages]]
pnpm = "typescript"
brew = "typescript"

[[pnpmTools.packages]]
pnpm = "typescript-language-server"
# Absent from Catalina's snapshot.
brew = { default = "typescript-language-server", catalina = "" }

[[pnpmTools.packages]]
pnpm = "bash-language-server"
brew = "bash-language-server"

[[pnpmTools.packages]]
pnpm = "yaml-language-server"
brew = "yaml-language-server"

[[pnpmTools.packages]]
pnpm = "@mermaid-js/mermaid-cli"
# Disabled in Big Sur's snapshot and absent from Monterey's. Where the
# formula is used, js-tooling.sh also runs its bundled Puppeteer installer.
brew = { default = "mermaid-cli", bigsur = "", monterey = "" }

[[pnpmTools.packages]]
pnpm = "wrangler"
# Before Ventura's snapshot the formula is wrangler-legacy v1 (disabled in
# the 2023/24 pins), not the Workers SDK CLI our projects use.
brew = { default = "cloudflare-wrangler", catalina = "", bigsur = "", monterey = "" }
# It runs workerd, whose npm package has builds for Linux and macOS on x64
# and arm64 and for Windows on x64 only (no @cloudflare/workerd-windows-arm64
# as of 2026-11-13). Under ARM Node, npm skips the x64 one, and workerd's
# postinstall, which used to fetch it anyway, now fails the whole global
# install (windows-apply on windows-11-arm, since 2026-11-10).
skip = ["windows/arm64"]
# Where pnpm supplies it, its esbuild (0.28.2) is a Go binary built for
# macOS 12, whose own postinstall check crashes on Big Sur and fails the whole
# global install (minintosh, macOS 11.7, 2026-11-17). Its workerd wants 13.5,
# but only for `wrangler dev`: workerd's check of itself fails without failing
# the install.
macosMin = 12

[[pnpmTools.packages]]
pnpm = "cline"
# Only the 2026 pins and mainline have it. Core's 3.0.3 is deprecated but
# still installable; it excludes macOS 27.
brew = { default = "", mainline = "cline", current = "cline", sonoma = "cline" }
brewMacosMax = 26

[[pnpmTools.packages]]
pnpm = "vercel"
# vercel-cli on the older pins and vercel on Sonoma's. Mainline moved it to
# a CLI cask, which Linux has too.
brew = { default = "vercel-cli", sonoma = "vercel", mainline = "" }
brewCask = { mainline = "vercel" }

[[pnpmTools.packages]]
# No core formula. On Windows on ARM 00-nt/570 builds it with Go instead:
# its npm package has only an amd64 executable there.
pnpm = "go-ios"

[[pnpmTools.packages]]
# Core's `cf` is a different timestamp filter, not Cloudflare's cf CLI.
pnpm = "cf"
# It depends on miniflare and so on workerd, which has no Windows ARM build,
# and failed the whole global install there as wrangler's did (above);
# windows-apply on windows-11-arm had failed on it since 2026-11-13.
skip = ["windows/arm64"]

[[pnpmTools.packages]]
# Sentry's CLI, `sentry`, which the Claude Code sentry-cli plugin's skills run.
# Core has no `sentry` formula (nor `sentry-cli`); Sentry's own is in its
# getsentry/tools tap. Its npm build is plain JavaScript, so every platform
# takes it. Installed this way it does not write the skills into ~/.claude
# itself, which only its install script, the tap and `sentry cli upgrade` do.
pnpm = "sentry"

[[pnpmTools.packages]]
# Supabase's CLI, `supabase`, which the Claude Code supabase plugin's skills
# run; its token is ~/.supabase/access-token (dot_supabase). The npm package is
# a Node shim over a prebuilt binary per platform, Windows on ARM and musl
# included. Core's formula, added 2025-11, is the 3.x CLI with a bottle for
# every mainline host (Apple Silicon from Sequoia, Linux on both arches); the
# 2026 pins carry an older release of it, so they take pnpm's. 3.x is built
# with Bun, whose macOS binaries need 13.0 (LC_BUILD_VERSION of 3.2.0's).
pnpm = "supabase"
brew = { default = "", mainline = "supabase" }
macosMin = 13

[[pnpmTools.packages]]
# Playwright's agent CLI, `playwright-cli`, which the Playwright team points
# coding agents at in place of its MCP server. It carries its own skill, which
# the installers copy into ~/.claude/skills and ~/.agents/skills after each
# update (js-tooling.sh, 00-nt/570). Plain JavaScript, no core formula.
pnpm = "@playwright/cli"

[[pnpmTools.packages]]
# The Alexa Skills Kit CLI, `ask`; its config is
# .chezmoitemplates/ask-cli-config.json. Every era has the formula: 2.30.7
# from Monterey's snapshot on, 2.28.0 on Catalina's, 2.30.5 on Big Sur's.
pnpm = "ask-cli"
brew = "ask-cli"
